services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-heartshop}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 .env 中設定 DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./heartshopsql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-heartshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heartshop-net

  backend:
    build:
      context: ./HeartShop-Spring/HeartShop
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-heartshop}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?請在 .env 中設定 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-HeartShop-Super-Secret-Key-For-Development-Environment-Change-This-In-Production-64Bytes}
      UPLOAD_DIR: /app/uploads
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - heartshop-net

  frontend:
    build:
      context: ./heartshop-frontend
      dockerfile: Dockerfile
      args:
        # 容器內部 SSR proxy 指向 backend 服務名稱
        VITE_API_BASE_URL: http://backend:8080
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:5173}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - heartshop-net

  admin:
    build:
      context: ./heartshop-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - heartshop-net

volumes:
  postgres_data:
  uploads_data:

networks:
  heartshop-net:
    driver: bridge
